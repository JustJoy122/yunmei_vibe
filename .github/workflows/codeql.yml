name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0' # 每周日凌晨1:30自动扫描

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual # 关键！改为手动模式，由我们控制编译过程

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 初始化 CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # 2. 搭建你现有的构建环境 (从你的 build-debug.txt 复制而来)
    - name: 设置 JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: 设置 Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: 接受 Android SDK 许可
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: 安装所需的 Android SDK 组件
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-37.0" \
          "build-tools;36.0.0" > /dev/null

    # 3. 执行编译，让 CodeQL 观察 Kotlin 编译过程
    - name: 构建 Debug 安装包（供 CodeQL 扫描）
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug

    # 4. 执行 CodeQL 分析
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"