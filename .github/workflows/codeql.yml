name: "CodeQL 代码安全扫描"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0' # 每周日凌晨 1:30 自动扫描

jobs:
  analyze:
    name: 代码分析 (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    # 让 Gradle 能从 GitHub Packages 下载私有依赖
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual # 手动模式允许 CodeQL 观察 Kotlin 编译过程

    steps:
    - name: 拉取代码
      uses: actions/checkout@v5

    - name: 初始化 CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: 设置 JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - name: 设置 Gradle 环境
      uses: gradle/actions/setup-gradle@v4

    - name: 接受 Android SDK 许可
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: 安装所需的 Android SDK 组件
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-37.0" \
          "build-tools;36.0.0" > /dev/null

    - name: 构建 Debug 安装包（供 CodeQL 扫描）
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug

    - name: 执行 CodeQL 分析并生成报告
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"