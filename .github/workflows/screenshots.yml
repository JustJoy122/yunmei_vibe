name: 自动截图

# 用于生成 README 里的界面截图：在模拟器里跑 -Pdemo（假数据 + Mock 网络），
# 把 4 种主题状态 × 3 个页面的截图拿回来并提交到 docs/screenshots/。
# 触发方式：手动点按，或每周一凌晨（北京时间）定时跑一次。
on:
  workflow_dispatch:
  schedule:
    # 17:00 UTC = 次日 01:00 北京时间，错开工作日的构建高峰
    - cron: "0 17 * * 0"

# 自动提交截图需要写权限；拉 GitHub Packages 上的 miuix 依赖需要读包权限
permissions:
  contents: write
  packages: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  # GitHub Packages 存取凭据（settings.gradle.kts 里读 GITHUB_ACTOR / GITHUB_TOKEN）
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PACKAGE_NAME: com.yunmei.vibe
  REMOTE_SHOT_DIR: /sdcard/Android/data/com.yunmei.vibe/files/screenshots

jobs:
  screenshots:
    name: Capture README screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v6

      # KVM 不开则 x86_64 模拟器走纯软件模拟，启动要数分钟，很容易超时
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: 接受 Android SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 安装所需的 Android SDK 组件
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_PLATFORM" \
            "$ANDROID_BUILD_TOOLS" > /dev/null

      # 构建与测试都在模拟器启动后跑：ScreenshotTest 需要真实窗口去点底栏、拍屏
      - name: 启动模拟器并生成截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          script: |
            chmod +x gradlew
            set -o pipefail

            # 先构建（-Pdemo 把 DEMO_MODE 置 true，启用 Mock 拦截器与演示数据灌入）
            ./gradlew --no-daemon :app:assembleDebug -Pdemo 2>&1 | tee gradle-screenshots.log

            # connectedDebugAndroidTest 会自动安装 app 与 androidTest 两个 APK
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pdemo 2>&1 | tee -a gradle-screenshots.log

            # 把设备上的截图拿回来
            rm -rf build/screenshots
            adb pull "$REMOTE_SHOT_DIR" build/screenshots
            mkdir -p docs/screenshots
            cp build/screenshots/*.png docs/screenshots/
            ls -l docs/screenshots

      - name: 保留截图与构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            build/screenshots
            gradle-screenshots.log
            app/build/reports
          if-no-files-found: warn
          retention-days: 14

      # 提交信息带 [skip ci]，避免触发自己与 build-debug.yml 无限循环
      - name: 提交新截图
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 更新自动截图 [skip ci]"
          file_pattern: "docs/screenshots/*.png"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
