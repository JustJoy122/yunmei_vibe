name: 自动截图

# 用于生成 README 里的界面截图：在模拟器里跑 -Pdemo（假数据 + Mock 网络），
# 把 4 种主题状态 × 3 个页面的截图拿回来并提交到 docs/screenshots/。
# 触发方式：
#   - 打 tag（v*）时自动跑：截图上标注的就是这个正式版本号；
#   - 也可以手动点按跑：截图上标注「versionName-dev (短 commit)」，便于确认图是哪次构建出的。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 自动提交截图需要写权限；拉 GitHub Packages 上的 miuix 依赖需要读包权限
permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  # GitHub Packages 存取凭据（settings.gradle.kts 里读 GITHUB_ACTOR / GITHUB_TOKEN）
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PACKAGE_NAME: com.yunmei.vibe
  # 截图落在应用私有外部目录，测试跑完（App 仍安装）直接 adb pull 取走。
  REMOTE_SHOT_DIR: /sdcard/Android/data/com.yunmei.vibe/files/screenshots

jobs:
  screenshots:
    name: Capture README screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 始终检出 main：tag 触发时 checkout 会落在 detached HEAD，
      # 后面 git-auto-commit 就没法在分支上提交。tag 名只用于「标注版本号」，
      # 截图内容取自 main 的最新代码（本项目的 release tag 都打在 main 上）。
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # main 上挂着「必需状态检查」规则：GITHUB_TOKEN 推送会被 GH013 拒掉，
          # 只有管理员身份（PAT）能绕过。没配 PAT 时退回 GITHUB_TOKEN，走分支兜底。
          token: ${{ secrets.SCREENSHOTS_PAT || secrets.GITHUB_TOKEN }}

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v6

      # 版本号要写进 README 的截图说明里，所以放在构建之前算好并落盘：
      #   - tag 触发：用 tag 名（v0.4.9）
      #   - 手动/branch 触发：versionName + 短 commit（0.4.9-dev (abc1234)）
      - name: 计算版本号并写入 README
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_LABEL="${GITHUB_REF_NAME}"
          else
            VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
            VERSION_LABEL="${VERSION_NAME}-dev (${GITHUB_SHA:0:7})"
          fi
          echo "版本号: ${VERSION_LABEL}"
          printf '%s\n' "${VERSION_LABEL}" > version.txt

          # 只替换 <!--VER-->…<!--/VER--> 之间的内容，README 其余部分一个字都不动
          sed -i "s|<!--VER-->.*<!--/VER-->|<!--VER-->${VERSION_LABEL}<!--/VER-->|" README.md
          grep -n "<!--VER-->" README.md

          echo "label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"

      # KVM 不开则 x86_64 模拟器走纯软件模拟，启动要数分钟，很容易超时
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: 接受 Android SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 安装所需的 Android SDK 组件
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_PLATFORM" \
            "$ANDROID_BUILD_TOOLS" > /dev/null

      # 构建与测试都在模拟器启动后跑：ScreenshotTest 需要真实窗口去点底栏、拍屏
      - name: 启动模拟器并生成截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # 不给 profile 时 AVD 是 320x640@160dpi 的小屏（截图只有 320 宽，糊）
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -Pdemo 2>&1 | tee gradle-screenshots.log
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell input keyevent 224
            adb shell wm dismiss-keyguard
            adb shell wm size 1440x3200
            adb shell wm density 560
            adb shell settings put system screen_off_timeout 2147483647
            adb logcat -c
            adb shell am instrument -w -e class com.yunmei.vibe.ScreenshotTest com.yunmei.vibe.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee instrumentation.log || echo "am instrument 非零退出（细节见 instrumentation.log）"
            adb logcat -d -s ScreenshotTest | tail -100
            adb shell ls -l "$REMOTE_SHOT_DIR" 2>&1 || true
            mkdir -p build/screenshots
            adb pull "$REMOTE_SHOT_DIR/." build/screenshots/ || echo "私有目录 pull 失败"
            mkdir -p docs/screenshots
            cp build/screenshots/*.png docs/screenshots/ 2>/dev/null || true
            ls -l build/screenshots || true
            test -n "$(find build/screenshots -name '*.png' -type f -print -quit)" || { echo "::error::没有拿到任何截图，对照上面的 ls 与 logcat 判断是没跑起来还是没落盘"; exit 1; }
            echo "本轮拉到 $(find build/screenshots -name '*.png' -type f | wc -l) 张"

      - name: 保留截图与构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            build/screenshots
            gradle-screenshots.log
            instrumentation.log
            app/build/reports
          if-no-files-found: warn
          retention-days: 14

      # 提交信息带 [skip ci]，避免触发自己与 build-debug.yml 无限循环
      - name: 提交新截图
        env:
          SCREENSHOTS_PAT: ${{ secrets.SCREENSHOTS_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots README.md
          if git diff --cached --quiet; then
            echo "截图与 README 没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新自动截图 [skip ci]"
          if [ -n "${SCREENSHOTS_PAT:-}" ]; then
            git push origin HEAD:main
          else
            # 走 PR 时不能带 [skip ci]：否则该提交上所有工作流都会被跳过，
            # 必需状态检查永远不出现，PR 反而合不进去。
            git commit --amend -m "chore: 更新自动截图"
            BRANCH="chore/screenshots-${GITHUB_RUN_NUMBER}"
            git push origin "HEAD:${BRANCH}"
            echo "::warning::未配置 SCREENSHOTS_PAT，截图已推到分支 ${BRANCH}"
            gh pr create --base main --head "${BRANCH}" \
              --title "chore: 更新自动截图" \
              --body "由 .github/workflows/screenshots.yml 生成。合并后 README 会使用这批图。" || true
          fi
